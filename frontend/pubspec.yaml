name: My_truck
description: "A new Flutter project."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.4.5
  image_picker: ^1.1.2
  font_awesome_flutter: ^10.0.0
  google_maps_flutter: ^2.1.7
  geolocator: ^13.0.1
  geocoding: ^3.0.0
  path_provider: ^2.0.11
  flutter_dotenv: ^5.0.2
  http: ^1.2.2
  webview_flutter: ^4.10.0
  

flutter:
  assets:
    - assets/splash_video.mp4
    - assets/logo.png  # Your logo image
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
        - asset: assets/fonts/NotoSans-Bold.ttf
          weight: 700


dev_dependencies:
  flutter_launcher_icons: ^0.14.1

flutter_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png" # Your app icon path
