<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SSE Test - Driver and Client</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      display: flex;
      justify-content: space-around;
    }
    .container {
      width: 45%;
      padding: 20px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .log {
      height: 300px;
      overflow-y: scroll;
      background-color: #f8f8f8;
      padding: 10px;
      margin-top: 10px;
      border: 1px solid #ddd;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>Driver SSE Stream</h2>
    <input type="text" id="driverId" placeholder="Enter Driver ID" />
    <button onclick="connectDriver()">Connect Driver</button>
    <div class="log" id="driverLog"></div>
  </div>

  <div class="container">
    <h2>Client SSE Stream</h2>
    <input type="text" id="clientId" placeholder="Enter Client ID" />
    <button onclick="connectClient()">Connect Client</button>
    <div class="log" id="clientLog"></div>
  </div>

  <script>
    function connectDriver() {
      const driverId = document.getElementById('driverId').value;
      if (!driverId) {
        alert('Please enter a Driver ID');
        return;
      }

      const driverLog = document.getElementById('driverLog');
      driverLog.innerHTML = 'Connecting to Driver SSE Stream...<br>';

      const driverEventSource = new EventSource(`http://127.0.0.1:8000/api/sse/driver/${driverId}`);

      driverEventSource.onmessage = function(event) {
        driverLog.innerHTML += `<div>Message: ${event.data}</div>`;
        driverLog.scrollTop = driverLog.scrollHeight;
      };

      driverEventSource.onerror = function() {
        driverLog.innerHTML += '<div style="color: red;">Connection lost or failed.</div>';
      };
    }

    function connectClient() {
      const clientId = document.getElementById('clientId').value;
      if (!clientId) {
        alert('Please enter a Client ID');
        return;
      }

      const clientLog = document.getElementById('clientLog');
      clientLog.innerHTML = 'Connecting to Client SSE Stream...<br>';

      const clientEventSource = new EventSource(`http://127.0.0.1:8000/api/sse/client/${clientId}`);

      clientEventSource.onmessage = function(event) {
        clientLog.innerHTML += `<div>Message: ${event.data}</div>`;
        clientLog.scrollTop = clientLog.scrollHeight;
      };

      clientEventSource.onerror = function() {
        clientLog.innerHTML += '<div style="color: red;">Connection lost or failed.</div>';
      };
    }
  </script>

</body>
</html>
